html[data-theme="light"]{

}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.75;
  background:
    radial-gradient(1000px 560px at 82% -8%, rgba(63,224,255,.075), transparent 60%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    var(--bg);
  background-size:auto, 34px 34px, 34px 34px, auto;
}
html[data-theme="light"] body{
  background:
    radial-gradient(1000px 560px at 82% -8%, rgba(0,124,158,.06), transparent 60%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    var(--bg);
  background-size:auto, 34px 34px, 34px 34px, auto;
}
::selection{background:var(--cy);color:var(--on-cy)}
a{color:var(--cy);text-decoration:none}

/* ============ 侧栏：品牌 / 搜索 ============ */
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line);position:relative}
.brand::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--cy);box-shadow:0 0 14px var(--cy)}
.brand .tag{font:10px var(--mono);letter-spacing:2px;color:var(--cy);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.brand .tag::before{content:"";width:6px;height:6px;background:var(--cy);box-shadow:0 0 8px var(--cy);animation:pulse 2.2s infinite}
.brand .tag span{color:var(--faint)}
.brand h1{font-size:21px;font-weight:800;letter-spacing:2px;margin:8px 0 3px;text-shadow:0 0 18px rgba(63,224,255,.28)}
.brand .sub{font:11px var(--mono);color:var(--faint);letter-spacing:1px}

.search{padding:14px 16px 12px}
.search-box{position:relative}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--cy);font:14px var(--mono);pointer-events:none}
.search input{
  width:100%;padding:10px 12px 10px 33px;background:var(--input);
  border:1px solid var(--line);color:var(--txt);font:12.5px var(--mono);
  letter-spacing:.4px;outline:none;clip-path:var(--clip);transition:.2s;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--cy);box-shadow:inset 0 0 16px var(--cy-s)}

/* ============ 侧栏：导航 ============ */
/* 吸附层级高度：一级科目 46px，二级分类 40px，三级分组 36px。逐级累加保证无间隙 */
:root{--nav-h1:46px;--nav-h2:40px;--nav-h3:36px}
.nav{flex:1;overflow-y:auto;padding:0 0 40px}
.nav::-webkit-scrollbar,.main::-webkit-scrollbar{width:9px}
.nav::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:var(--line2);border:2px solid var(--bg)}
.nav::-webkit-scrollbar-track,.main::-webkit-scrollbar-track{background:transparent}
.idx{
  display:inline-block;flex:0 0 auto;white-space:nowrap;min-width:34px;text-align:center;
  font:10px var(--mono);color:var(--faint);letter-spacing:.5px;
  border:1px solid var(--line);padding:1px 4px;margin-right:9px;
  clip-path:polygon(0 0,calc(100% - 5px) 0,100% 5px,100% 100%,5px 100%,0 calc(100% - 5px));
}
.nav .home{
  padding:0 18px;height:var(--nav-h1);cursor:pointer;font-weight:700;color:var(--txt);
  display:flex;align-items:center;font-size:16px;letter-spacing:.5px;
  border-left:2px solid transparent;transition:.18s;
}
.nav .home:hover,.nav .home.active{background:var(--cy-s);border-left-color:var(--cy);color:var(--cy)}
.nav .home.active .idx{color:var(--cy);border-color:var(--cy)}
.idx.diamond{border-color:transparent;clip-path:none;color:var(--or);font-size:13px}
.chapter{margin-top:0}
.ch-header{
  display:flex;align-items:center;gap:8px;padding:0 18px;height:var(--nav-h1);
  box-sizing:border-box;cursor:pointer;
  color:var(--txt);user-select:none;font:600 16px var(--mono);letter-spacing:.6px;
  border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);transition:.18s;
  position:sticky;top:0;z-index:60;
  background:var(--bg);
}
.ch-header:hover{color:var(--cy);background:var(--elev)}
.ch-header .ch-no{color:var(--or);font-weight:700;font-size:14px}
.ch-header .ch-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-header .cnt{font:10px var(--mono);color:var(--faint);border:1px solid var(--line);padding:1px 6px}
.ch-header .arrow{color:var(--cy);font-size:11px;width:12px;text-align:center;transition:transform .18s}
.ch-sections{overflow:visible}
.ch-sections.collapsed{display:none}
.sec{
  display:flex;align-items:center;min-height:42px;padding:9px 18px 9px 20px;cursor:pointer;
  color:var(--dim);font-size:15px;line-height:1.45;border-left:2px solid transparent;transition:.16s;
}
.sec .sec-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec:hover{color:var(--txt);background:var(--elev);border-left-color:var(--line2)}
.sec:hover .idx{color:var(--cy);border-color:var(--line2)}
.sec.active{
  color:var(--cy);background:linear-gradient(90deg, var(--cy-s), transparent);
  border-left-color:var(--cy);font-weight:700;box-shadow:inset 0 0 22px var(--cy-s);
}
.sec.active .idx{color:var(--on-cy);background:var(--cy);border-color:var(--cy)}

/* ============ 侧栏：多级分组（分类 / 教材 / 章），统一吸附无间隙 ============ */
.grp-header{
  margin:0;padding:0 18px;box-sizing:border-box;
  display:flex;align-items:center;gap:8px;
  user-select:none;cursor:pointer;transition:.16s;
  font:600 15px var(--sans);letter-spacing:.2px;color:var(--cy);
  border-left:2px solid var(--cy);border-bottom:1px solid var(--line2);
  background:var(--bg);               /* 不透明纯色，吸附时完全盖住下方滚动内容 */
}
.grp-header:hover{color:var(--txt);background:var(--elev)}
.grp-header .grp-arrow{color:var(--cy);font-size:11px;width:11px;text-align:center;transition:transform .18s}
.grp-header .grp-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-header .grp-cnt{font:10px var(--mono);color:var(--faint)}
/* 二级分类：top = h1；高 h2 */
.grp-header[data-level="2"]{
  height:var(--nav-h2);top:var(--nav-h1);z-index:58;
  color:var(--or);border-left-color:var(--or);
}
.grp-header[data-level="2"] .grp-arrow{color:var(--or)}
.grp-header[data-level="2"]:hover{background:var(--elev)}
/* 三级分组（教材名 / 章）：top = h1+h2；高 h3 */
.grp-header[data-level="3"]{
  height:var(--nav-h3);top:calc(var(--nav-h1) + var(--nav-h2));z-index:56;
  font-size:14px;color:var(--dim);border-left-color:var(--line2);
  padding-left:30px;background:var(--bg);
}
.grp-header[data-level="3"] .grp-arrow{color:var(--dim)}
/* 更深层预留：每多一级累加一个 h3 */
.grp-header[data-level="4"]{
  height:var(--nav-h3);top:calc(var(--nav-h1) + var(--nav-h2) + var(--nav-h3));z-index:54;
  font-size:14px;color:var(--dim);border-left-color:var(--line2);padding-left:42px;background:var(--bg);
}
.grp-sections{overflow:visible}
.grp-sections.collapsed{display:none}

/* ============ 顶栏 HUD ============ */
.topbar{
  position:sticky;top:0;z-index:6;height:54px;flex:0 0 54px;
  display:flex;align-items:center;gap:12px;padding:0 30px;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.topbar::after{content:"";position:absolute;bottom:-1px;left:0;width:170px;height:1px;background:linear-gradient(90deg,var(--cy),transparent)}
.topbar .crumb{font:11px var(--mono);letter-spacing:1.4px;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.status{font:10px var(--mono);letter-spacing:1.5px;color:var(--cy);display:flex;align-items:center;gap:7px;white-space:nowrap}
.status .dot{width:6px;height:6px;background:var(--cy);box-shadow:0 0 9px var(--cy);animation:pulse 2.2s infinite}
.topbar button.hud{
  background:var(--elev);border:1px solid var(--line2);color:var(--dim);
  padding:7px 14px;cursor:pointer;font:10.5px var(--mono);letter-spacing:1.2px;
  clip-path:var(--clip);transition:.18s;text-transform:uppercase;
}
.topbar button.hud:hover{border-color:var(--cy);color:var(--cy);box-shadow:var(--glow)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ============ 正文 ============ */
.content{max-width:900px;width:100%;margin:0 auto;padding:44px 52px 28px;position:relative;flex:1 0 auto}
.content h1{
  font-size:30px;font-weight:800;letter-spacing:1px;color:var(--txt);
  margin:0 0 28px;padding:0 0 15px;border-bottom:1px solid var(--line);position:relative;
}
.content h1::after{content:"";position:absolute;bottom:-1px;left:0;width:96px;height:2px;background:var(--cy);box-shadow:0 0 12px var(--cy)}
.content h2{
  font-size:20px;margin:46px 0 16px;padding:9px 16px;color:var(--txt);
  border-left:3px solid var(--or);background:linear-gradient(90deg, var(--or-s), transparent 70%);
  letter-spacing:.5px;position:relative;
}
.content h2::before{content:"";position:absolute;left:0;top:0;width:24px;height:1px;background:var(--or)}
.content h3{font-size:16px;margin:28px 0 10px;color:var(--cy);font-weight:700;letter-spacing:.6px}
.content h4{font-size:15px;margin:22px 0 8px;color:var(--dim)}
.content p{margin:13px 0}
.content ul,.content ol{margin:13px 0;padding-left:28px}
.content li{margin:5px 0}
.content li::marker{color:var(--cy);font-family:var(--mono)}
.content strong{color:var(--txt);font-weight:700}
.content hr{border:none;height:1px;background:linear-gradient(90deg,var(--line),var(--line2),var(--line));margin:32px 0}

/* 引用块：NOTE 面板 */
.content blockquote{
  margin:18px 0;padding:15px 18px;position:relative;
  background:linear-gradient(90deg, var(--cy-s), transparent 62%);
  border:1px solid var(--line);border-left:3px solid var(--cy);
}
.content blockquote::before{
  content:"NOTE";position:absolute;top:-1px;right:12px;
  background:var(--cy);color:var(--on-cy);font:9px var(--mono);
  letter-spacing:1.6px;padding:1px 8px;
}
.content blockquote p{margin:4px 0}
.content blockquote strong{color:var(--cy)}

/* 代码 / 表格 */
.content code{background:var(--elev);color:var(--or);padding:2px 6px;border:1px solid var(--line);font-family:var(--mono);font-size:13px}
.content pre{background:var(--input);border:1px solid var(--line);border-left:3px solid var(--or);padding:16px 18px;overflow-x:auto;margin:16px 0;position:relative}
.content pre::before{content:"CODE";position:absolute;top:0;right:10px;font:9px var(--mono);letter-spacing:1.6px;color:var(--on-or);background:var(--or);padding:0 7px}
.content pre code{background:none;border:none;color:var(--txt);padding:0}
.content table{border-collapse:collapse;margin:18px 0;width:100%;font-size:13.5px;border:1px solid var(--line)}
.content th,.content td{border:1px solid var(--line);padding:8px 12px;text-align:left}
.content th{background:var(--elev);color:var(--cy);font:11.5px var(--mono);letter-spacing:1px;text-transform:uppercase}
.content tr:nth-child(even) td{background:rgba(127,160,190,.045)}

/* ============ 内容面板：例题 / 定义 / 定理 / 解 ============ */
.md-box{
  position:relative;margin:20px 0;padding:16px 20px 15px 22px;
  background:var(--elev);border:1px solid var(--line);border-left:3px solid var(--cy);
  box-shadow:inset 0 0 26px var(--cy-s);
}
.md-box::before{
  content:attr(data-tag);position:absolute;top:-1px;right:12px;
  font:9px var(--mono);letter-spacing:1.8px;padding:2px 9px;
  color:var(--on-cy);background:var(--cy);
}
.md-box.box-def{border-left-color:var(--vi);box-shadow:inset 0 0 26px var(--vi-s)}
.md-box.box-def::before{background:var(--vi);color:#fff}
.md-box.box-thm{border-left-color:var(--or);box-shadow:inset 0 0 26px var(--or-s)}
.md-box.box-thm::before{background:var(--or);color:var(--on-or)}
.md-box.box-sol{border-left-color:var(--line2);box-shadow:none;background:rgba(127,160,190,.045)}
.md-box.box-sol::before{background:var(--line2);color:var(--txt)}
.md-box.box-proof{border-left-color:var(--line);box-shadow:none;background:transparent}
.md-box.box-proof::before{background:var(--line);color:var(--txt)}
/* 「解 / 证明」并入所属例题框，作为内部小节而非独立面板 */
.md-box .sol-inline{margin:16px 0 6px;padding:10px 0 0 14px;border-top:1px dashed var(--line2);position:relative}
.md-box .sol-inline > strong:first-child{color:var(--or)}
.md-box .sol-inline.proof-inline > strong:first-child{color:var(--vi)}
/* 框内元素不再自带外边距边界，避免内容溢出框体 */
.md-box > :first-child{margin-top:0}
.md-box > :last-child{margin-bottom:0}
.md-box p,.md-box ul,.md-box ol,.md-box table,.md-box pre{margin:10px 0}
.md-box mjx-container[display="true"]{margin:12px 0!important}

/* 链接：下划线从左展开 */
.content a{background-image:linear-gradient(var(--cy),var(--cy));background-repeat:no-repeat;background-position:left bottom;background-size:0% 1px;padding-bottom:1px;transition:background-size .25s ease,color .2s ease}
.content a:hover{background-size:100% 1px;color:var(--cy)}

.noresult{color:var(--faint);padding:24px 18px;font:12px var(--mono);border-left:2px solid var(--or)}
.loading{color:var(--cy);text-align:center;padding:90px 0;font:11px var(--mono);letter-spacing:2px}
mjx-container{outline:none;color:var(--txt)}
.content mjx-container[display="true"]{margin:18px 0!important;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

.estp-footer-wrap{width:100%;max-width:900px;margin:0 auto;padding:0 52px;flex:0 0 auto}
.estp-footer{
  margin:40px 0 0;padding:16px 0 8px;position:relative;text-align:center;
  border-top:1px solid var(--line);
}
.estp-footer::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:96px;height:2px;background:var(--cy);box-shadow:0 0 10px var(--cy)}
.footer-name{position:relative;z-index:1;font:11px var(--mono);letter-spacing:2.4px;color:var(--cy);text-transform:uppercase}
.footer-meta{position:relative;z-index:1;font:10px var(--mono);color:var(--faint);margin-top:15px;letter-spacing:.6px}

/* ============ 响应式 ============ */
.scrim{display:none}
.menu-btn{display:none}
@media (max-width:820px){
  .sidebar{position:fixed;left:0;top:0;z-index:20;height:100vh;transform:translateX(-100%);transition:transform .22s;box-shadow:var(--shadow)}
  .sidebar.open{transform:translateX(0)}
  .scrim{display:block;position:fixed;inset:0;z-index:19;background:rgba(3,9,16,.72);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
  .scrim.show{opacity:1;pointer-events:auto}
  .content{padding:28px 20px 20px}
  .estp-footer-wrap{padding:0 20px}
  .main::before{left:0;--wm-size:300px}
  .status{display:none}
  .menu-btn{display:inline-block;background:var(--elev);border:1px solid var(--line2);color:var(--cy);padding:6px 10px;cursor:pointer;font:13px var(--mono);clip-path:var(--clip)}
  .topbar{padding:0 16px}
}

function rewriteReadmeLinks(txt){
  return String(txt).replace(/\[([^\]]*)\]\(([^)\s]+)\)/g, function(m, t, u){
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)) return m;  // http(s) 等外链原样保留
    try { return '[' + t + '](#sec/' + encodeURIComponent(decodeURI(u)) + ')'; }
    catch(e){ return m; }
  });
}
function fetchText(url){
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error(url + ' → HTTP ' + r.status);
    return r.text();
  });
}
function loadAllMarkdown(){
  const jobs = [fetchText('README.md').then(function(t){
    DATA.readme.content = rewriteReadmeLinks(t);
  })];
  DATA.chapters.forEach(function(ch){
    ch.sections.forEach(function(sec){
      jobs.push(fetchText(encodeURI(sec.id)).then(function(t){ sec.content = t; }));
    });
  });
  return Promise.all(jobs);
}

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const home = document.createElement('div');
  home.className = 'home';
  home.innerHTML = '<span class="idx diamond">◆</span><span>' + DATA.readme.title + '</span>';
  home.onclick = function(){ openDoc(DATA.readme); closeSidebar(); };
  nav.appendChild(home);

  DATA.chapters.forEach(function(ch){
    const cwrap = document.createElement('div');
    cwrap.className = 'chapter';
    const hdr = document.createElement('div');
    hdr.className = 'ch-header';
    hdr.innerHTML = '<span class="ch-no">' + String(ch.num).padStart(2,'0') + '</span>' +
      '<span class="ch-name">' + ch.shortTitle + '</span>' +
      '<span class="cnt">' + ch.sections.length + '</span><span class="arrow">▾</span>';
    hdr.onclick = function(){
      const sec = cwrap.querySelector('.ch-sections');
      sec.classList.toggle('collapsed');
      hdr.querySelector('.arrow').textContent = sec.classList.contains('collapsed') ? '▸' : '▾';
    };

    const secs = document.createElement('div');
    secs.className = 'ch-sections';
    // 用 path 构建多层树，递归渲染；每一级都可折叠并吸附
    const tree = { children:{}, order:[], leaves:[] };
    ch.sections.forEach(function(s){
      const parts = (s.path && s.path.length) ? s.path : [s.group || '考试大纲'];
      let node = tree;
      parts.forEach(function(name){
        if(!node.children[name]){
          node.children[name] = { children:{}, order:[], leaves:[] };
          node.order.push(name);
        }
        node = node.children[name];
      });
      node.leaves.push(s);
    });
    function renderLevel(node, level, parent){
      node.order.forEach(function(name){
        const child = node.children[name];
        const count = countLeaves(child);
        const block = document.createElement('div');
        block.className = 'grp-block';
        const gh = document.createElement('div');
        gh.className = 'grp-header';
        gh.setAttribute('data-level', String(level));
        gh.innerHTML = '<span class="grp-arrow">▾</span><span class="grp-name">' + name + '</span>' +
          '<span class="grp-cnt">' + count + '</span>';
        const gsec = document.createElement('div');
        gsec.className = 'grp-sections';
        gh.onclick = function(){
          gsec.classList.toggle('collapsed');
          gh.querySelector('.grp-arrow').textContent = gsec.classList.contains('collapsed') ? '▸' : '▾';
        };
        renderLevel(child, level + 1, gsec);
        child.leaves.forEach(function(s){ gsec.appendChild(makeSecEl(s)); });
        block.appendChild(gh); block.appendChild(gsec);
        parent.appendChild(block);
      });
    }
    function countLeaves(node){
      let n = node.leaves.length;
      node.order.forEach(function(k){ n += countLeaves(node.children[k]); });
      return n;
    }
    renderLevel(tree, 2, secs);
    tree.leaves.forEach(function(s){ secs.appendChild(makeSecEl(s)); });
    cwrap.appendChild(hdr); cwrap.appendChild(secs);
    nav.appendChild(cwrap);
  });
}
function secIndex(s){

}
function makeSecEl(s){

// 让当前条目停在侧栏中线；上方内容不足时由浏览器夹到顶部
function revealActiveNav(){
  const nav = document.getElementById('nav');
  const active = nav.querySelector('.sec.active') || nav.querySelector('.home.active');
  if(!active) return;
  // 展开所属的所有祖先容器（一级章 + 各级分类/教材/章）
  let node = active.parentElement;
  while(node && node !== nav){
    if(node.classList && (node.classList.contains('ch-sections') || node.classList.contains('grp-sections'))){
      if(node.classList.contains('collapsed')){
        node.classList.remove('collapsed');
        const hdr = node.previousElementSibling;
        if(hdr){
          const arr = hdr.querySelector('.arrow') || hdr.querySelector('.grp-arrow');
          if(arr) arr.textContent = '▾';
        }
      }
    }
    node = node.parentElement;
  }
  const navRect = nav.getBoundingClientRect();
  const elRect = active.getBoundingClientRect();
  const delta = (elRect.top - navRect.top) - (nav.clientHeight - elRect.height)/2;
  try { nav.scrollBy({ top: delta, behavior:'smooth' }); }
  catch(err){ nav.scrollTop += delta; }
}

function protectMath(md){
  const display = [], inline = [];
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, function(m,p1){
    display.push('$$'+p1+'$$');
    return '\u0000B'+(display.length-1)+'\u0000';
  });
  md = md.replace(/\$([^$\n]+?)\$/g, function(m,p1){
    inline.push('$'+p1+'$');
    return '\u0000I'+(inline.length-1)+'\u0000';
  });
  return { md: md, display: display, inline: inline };
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Markdown 里的真正的外部链接（http/https/mailto/tel/协议相对）统一新标签打开；
// 站内 #sec/ 锚点与相对 .md 文档链接保留，由应用内路由在原地打开。
function externalizeLinks(html){
  return html.replace(/<a\s+([^>]*)>/gi, function(tag, attrs){
    if(/\btarget\s*=/i.test(attrs)) return tag;
    const m = attrs.match(/\bhref\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/i);
    if(!m) return tag;
    const href = m[1] || m[2] || m[3] || '';
    if(/^#/.test(href)) return tag;
    if(!/^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return tag;
    return '<a ' + attrs + ' target="_blank" rel="noopener noreferrer">';
  });
}
function renderMarkdown(src){
  if (typeof marked === 'undefined') {
    return '<div class="noresult">MARKDOWN RENDERER OFFLINE // 显示原文</div><pre>' + escapeHtml(src) + '</pre>';
  }
  const r = protectMath(src);
  let html = externalizeLinks(marked.parse(r.md));
  html = html.replace(/\u0000B(\d+)\u0000/g, function(m,i){ return r.display[+i]; });
  html = html.replace(/\u0000I(\d+)\u0000/g, function(m,i){ return r.inline[+i]; });
  return html;
}
// 把「例 / 定义 / 定理 / 解 / 证明」开头的段落渲染成机甲数据面板
// 段落首行标签 → 面板类型；null 表示普通段落
function blockLabel(node){
  if(node.tagName !== 'P') return null;
  const s = node.querySelector(':scope > strong');
  if(!s) return null;
  const t = (s.textContent || '').trim();
  if(/^例\s*\d/.test(t)) return 'ex';
  if(/^定义/.test(t)) return 'def';
  if(/^定理/.test(t)) return 'thm';
  if(/^解$/.test(t)) return 'sol';
  if(/^证明$/.test(t)) return 'proof';
  return null;
}
// 把「例/定义/定理」起始的整段连续内容（含解、公式、表格、列表）包进同一个面板；
// 「解/证明」并入所属例题，不再单独成框；遇到标题或分割线则结束当前面板。
function decorateContent(){
  const root = document.getElementById('content');
  const nodes = Array.prototype.slice.call(root.children);
  const META = {
    ex:['EXAMPLE','box-ex'], def:['DEFINITION','box-def'], thm:['THEOREM','box-thm'],
    sol:['SOLUTION','box-sol'], proof:['PROOF','box-proof']
  };
  let box = null;
  nodes.forEach(function(node){
    const label = blockLabel(node);
    if(label === 'ex' || label === 'def' || label === 'thm'){
      const meta = META[label];
      box = document.createElement('div');
      box.className = 'md-box ' + meta[1];
      box.setAttribute('data-tag', meta[0]);
      root.insertBefore(box, node);
      box.appendChild(node);
    } else if(label === 'sol' || label === 'proof'){
      if(box){
        node.classList.add('sol-inline');
        if(label === 'proof') node.classList.add('proof-inline');
        box.appendChild(node);
      } else {
        const meta = META[label];
        box = document.createElement('div');
        box.className = 'md-box ' + meta[1];
        box.setAttribute('data-tag', meta[0]);
        root.insertBefore(box, node);
        box.appendChild(node);
      }
    } else if(/^H[1-4]$/.test(node.tagName) || node.tagName === 'HR'){
      box = null;
    } else if(box){
      box.appendChild(node);
    }
  });
}

let currentDoc = null;
function openDoc(doc, ch){
  currentDoc = doc;
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">LOADING DATA…</div>';
  const crumbParts = (doc.path && doc.path.length) ? doc.path : [doc.group, doc.subgroup].filter(Boolean);
  document.getElementById('crumb').textContent = (ch ? [ch.shortTitle].concat(crumbParts).filter(Boolean).join(' / ') + ' / ' : 'SYS / ') + doc.title;
  document.querySelectorAll('.sec').forEach(function(e){ e.classList.remove('active'); });
  document.querySelectorAll('.home').forEach(function(e){ e.classList.remove('active'); });
  if(ch){
    const ci = DATA.chapters.indexOf(ch);
    const si = ch.sections.indexOf(doc);
    if(ci>=0 && si>=0){
      const chapEl = document.querySelectorAll('.chapter')[ci];
      if(chapEl){
        const list = chapEl.querySelectorAll('.sec');
        if(list[si]) list[si].classList.add('active');
      }
    }
  } else {
    const home = document.querySelector('.home');
    if(home) home.classList.add('active');
  }
  content.innerHTML = renderMarkdown(doc.content);
  decorateContent();
  appendFooter();
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetPromise([content]).catch(function(){});
  }
  document.getElementById('main').scrollTop = 0;
  revealActiveNav();
}

function doSearch(q){
  const nav = document.getElementById('nav');
  q = q.trim().toLowerCase();
  if(!q){ buildNav(); return; }
  const results = [];
  if(DATA.readme.content.toLowerCase().indexOf(q)>=0) results.push({doc: DATA.readme});
  DATA.chapters.forEach(function(ch){
    ch.sections.forEach(function(s){
      if(s.title.toLowerCase().indexOf(q)>=0 || s.content.toLowerCase().indexOf(q)>=0){
        results.push({doc:s, ch:ch});
      }
    });
  });
  if(results.length===0){ nav.innerHTML = '<div class="noresult">NO SIGNAL // 未找到相关结果</div>'; return; }
  nav.innerHTML = '';
  results.slice(0,80).forEach(function(r){
    const el = makeSecEl(r.doc);
    el.onclick = function(){ openDoc(r.doc, r.ch); closeSidebar(); };
    nav.appendChild(el);
  });
}

function updateThemeBtn(theme){
  document.getElementById('themeBtn').textContent = theme==='dark' ? 'NIGHT' : 'DAY';
}
function initTheme(){
  const saved = localStorage.getItem('up_theme');
  const theme = saved || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeBtn(theme);
}
document.getElementById('themeBtn').onclick = function(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('up_theme', next);
  updateThemeBtn(next);
};
document.getElementById('menuBtn').onclick = function(){
  const sb = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const opened = sb.classList.toggle('open');
  if(scrim) scrim.classList.toggle('show', opened);
};
document.getElementById('scrim').onclick = function(){ closeSidebar(); };
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSidebar(); });
document.getElementById('search').addEventListener('input', function(e){ doSearch(e.target.value); });

// README 中指向 .md 的链接 → 应用内跳转
function findSectionById(id){
  for(let ci=0; ci<DATA.chapters.length; ci++){
    const ch = DATA.chapters[ci];
    for(let si=0; si<ch.sections.length; si++){
      if(ch.sections[si].id === id) return { ch: ch, s: ch.sections[si] };
    }
  }
  return null;
}
// 把相对 md 路径规范化为“章目录/文件名”，供正文内的相对链接跳转
function normalizeDocPath(p){
  const out = [];
  p.split('/').forEach(function(seg){
    if(!seg || seg === '.') return;
    if(seg === '..') out.pop();
    else out.push(seg);
  });
  return out.join('/');
}
document.getElementById('content').addEventListener('click', function(e){
  const a = e.target.closest ? e.target.closest('a') : null;
  if(!a) return;
  let href = a.getAttribute('href') || '';
  if(!href) return;
  let id = null;
  if(href.indexOf('#sec/') === 0){
    try { id = decodeURIComponent(href.slice(5)); } catch(err) { id = null; }
  } else {
    const bare = href.split('#')[0];
    if(!/\.md$/i.test(bare)) return;
    try { id = decodeURI(bare); } catch(err) { id = bare; }
  }
  if(!id) return;
  let r = findSectionById(id);
  if(!r && currentDoc && currentDoc.id){
    const base = currentDoc.id.split('/').slice(0, -1).join('/');
    r = findSectionById(normalizeDocPath(base + '/' + id));
  }
  if(r){ e.preventDefault(); openDoc(r.s, r.ch); }
});

loadAllMarkdown().then(function(){
  initTheme();
  buildNav();
  openDoc(DATA.readme);
}).catch(function(err){
  document.getElementById('content').innerHTML =
    '<div class="noresult">Markdown 加载失败：' + escapeHtml(err && err.message || String(err)) +
    '<br><br>本页通过相对路径读取 .md，需要通过 HTTP 打开（GitHub Pages 或本地静态服务），' +
    '直接双击 file:// 会被浏览器拦截。</div>';
});
